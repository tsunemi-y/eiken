<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいご 5きゅう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand" id="btnHome" role="button">えいご 5きゅう</div>
    <div class="countdown-chip">本番まで <b id="daysLeft">--</b> 日</div>
  </header>

  <!-- ===== ホーム ===== -->
  <section class="screen" id="screen-home">
    <p class="pace" id="paceMessage"></p>

    <button class="tile tile-primary" id="btnContinue">
      <span class="tile-main">
        <span class="tile-title" id="continueTitle">つづきから</span>
        <span class="tile-sub" id="continueSub"></span>
      </span>
      <span class="tile-arrow">→</span>
    </button>

    <div class="mode-grid">
      <button class="mode-card" id="btnRead">
        <span class="mode-ic">📖</span>
        <span class="mode-title">リーディング</span>
        <span class="mode-sub">英語を 読んで<br>いみを えらぶ</span>
      </button>
      <button class="mode-card" id="btnListen">
        <span class="mode-ic">🎧</span>
        <span class="mode-title">リスニング</span>
        <span class="mode-sub">英語を きいて<br>いみを えらぶ</span>
      </button>
    </div>

    <button class="tile" id="btnB">
      <span class="tile-main">
        <span class="tile-title">Ⓑ ふくしゅう</span>
        <span class="tile-sub" id="todayBoxLabel">きょうの ボックス</span>
      </span>
      <span class="badge hidden" id="boxNotif">0</span>
      <span class="tile-arrow">→</span>
    </button>
  </section>

  <!-- ===== Ⓐ はんいえらび ===== -->
  <section class="screen hidden" id="screen-ranges">
    <button class="back-btn" data-back="home">← もどる</button>
    <h2 class="scr-title" id="rangesTitle">📖 リーディング</h2>
    <p class="scr-desc" id="rangesDesc"></p>
    <div class="today-bar" id="rangeToday"></div>
    <div class="range-grid" id="rangeGrid"></div>
  </section>

  <!-- ===== Ⓐ たんごいちらん ===== -->
  <section class="screen hidden" id="screen-wordlist">
    <button class="back-btn" id="btnWordlistBack">← もどる</button>
    <h2 class="scr-title" id="wordlistTitle">たんごいちらん</h2>
    <p class="scr-desc">●●● が 3つで Ⓑへ すすみます。もう しっている 語は「しってる」で とばせます。</p>
    <div class="word-list" id="wordList"></div>
    <button class="tile tile-quiet" id="btnWordlistSkipAll"><span class="tile-main"><span class="tile-title">ぜんぶ しってる → まとめてⒷへ</span></span></button>
    <button class="tile tile-primary" id="btnWordlistStart"><span class="tile-main"><span class="tile-title">カードで おぼえる → クイズ</span></span><span class="tile-arrow">→</span></button>
  </section>

  <!-- ===== Ⓑ ようびボックス ===== -->
  <section class="screen hidden" id="screen-boxes">
    <button class="back-btn" data-back="home">← もどる</button>
    <h2 class="scr-title">Ⓑ ようびボックス</h2>
    <p class="scr-desc">おぼえた 語が、こたえた ようびの ボックスに 入ります。まちがえるとⒶに もどります。</p>
    <div class="box-grid" id="boxGrid"></div>
  </section>

  <!-- ===== おぼえる(カード) ===== -->
  <section class="screen hidden" id="screen-learn">
    <button class="back-btn" data-back="home">← やめる</button>
    <div class="row-head">
      <span class="chip" id="learnZoneTag">Ⓐ</span>
      <span class="pos" id="learnPos">1 / 10</span>
    </div>

    <div class="card" id="card">
      <div class="card-face" id="cardFront">
        <div class="card-no" id="cardNo">No.1</div>
        <div class="slot" id="cardSlotQ">?</div>
        <div class="card-en" id="cardEn">house</div>
        <button class="sound-btn" id="btnSpeak">もう いちど きく</button>
        <div class="card-hint">タップして こたえを みる</div>
      </div>
      <div class="card-face hidden" id="cardBack">
        <div class="card-en small" id="cardEnBack">house</div>
        <div class="slot" id="cardEmoji">🏠</div>
        <div class="card-ja" id="cardJa">いえ</div>
        <div class="vis hidden" id="cardVis"></div>
        <div class="card-ex" id="cardEx"></div>
        <button class="sound-btn" id="btnSpeak2">きく</button>
      </div>
    </div>

    <div class="listen-note hidden" id="listenNote">にほんごの さいごまで きいてね…</div>

    <div class="nav-row">
      <button class="tile tile-quiet tile-nav" id="btnPrev"><span class="tile-main"><span class="tile-title">← まえ</span></span></button>
      <button class="tile tile-primary tile-nav" id="btnNext"><span class="tile-main"><span class="tile-title">つぎ →</span></span></button>
    </div>
    <button class="tile tile-accent hidden" id="btnGoQuiz"><span class="tile-main"><span class="tile-title">クイズに すすむ</span></span><span class="tile-arrow">→</span></button>
  </section>

  <!-- ===== クイズ(Ⓐ・Ⓑ) ===== -->
  <section class="screen hidden" id="screen-quiz">
    <button class="back-btn" data-back="home">← やめる</button>
    <div class="row-head">
      <span class="chip" id="masteryTag"></span>
      <span class="pos"><span id="quizPos">1</span>/<span id="quizTotal">10</span></span>
    </div>
    <div class="bar"><div class="bar-fill" id="quizBar"></div></div>

    <div class="panel center">
      <div class="q-label" id="quizLabel">この たんごの いみは?</div>
      <div class="slot" id="quizSlot">?</div>
      <div class="q-en" id="quizEn">house</div>
      <div class="cloze hidden" id="quizCloze">
        <div class="cloze-en" id="clozeEn"></div>
        <div class="cloze-ja" id="clozeJa"></div>
      </div>
      <button class="sound-btn" id="btnQuizSpeak">きく</button>
      <div class="dots" id="dots"></div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback hidden" id="feedback"></div>
  </section>

  <!-- ===== けっか ===== -->
  <section class="screen hidden" id="screen-result">
    <div class="panel center result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-score"><span id="resultScore">0</span> <span class="slash">/</span> <span id="resultTotal">10</span></div>
      <div class="result-msg" id="resultMsg"></div>
    </div>
    <button class="tile tile-primary hidden" id="btnBackRanges"><span class="tile-main"><span class="tile-title">Ⓐ はんいいちらんへ</span></span></button>
    <button class="tile tile-primary hidden" id="btnBackBoxes"><span class="tile-main"><span class="tile-title">Ⓑ ボックスいちらんへ</span></span></button>
    <button class="tile" id="btnRetry"><span class="tile-main"><span class="tile-title">もう いちど クイズ</span></span></button>
    <button class="tile" id="btnReviewWrong"><span class="tile-main"><span class="tile-title">まちがえた 語を みる</span></span></button>
    <button class="tile tile-quiet" id="btnResultHome"><span class="tile-main"><span class="tile-title">ホームへ</span></span></button>
  </section>

  <!-- ===== まちがえた語 ===== -->
  <section class="screen hidden" id="screen-wrong">
    <button class="back-btn" id="btnWrongBack">← もどる</button>
    <h2 class="scr-title">まちがえた 語</h2>
    <div class="wrong-list" id="wrongList"></div>
  </section>

</div>

<div class="toast hidden" id="adv">
  <div class="toast-ic" id="advIc">✓</div>
  <div class="toast-body"><div class="toast-head" id="advHead"></div><div class="toast-name" id="advName"></div></div>
</div>

<script src="words-data.js"></script>
<script src="app.js"></script>
</body>
</html>

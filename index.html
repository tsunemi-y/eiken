<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいご 5きゅう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand" id="btnHome" role="button">えいご 5きゅう</div>
    <div class="countdown-chip">本番まで <b id="daysLeft">--</b> 日</div>
  </header>

  <!-- ===== ホーム ===== -->
  <section class="screen" id="screen-home">
    <p class="pace" id="paceMessage"></p>

    <button class="tile tile-primary" id="btnContinue">
      <span class="tile-main">
        <span class="tile-title" id="continueTitle">つづきから</span>
        <span class="tile-sub" id="continueSub"></span>
      </span>
      <span class="tile-arrow">→</span>
    </button>

    <button class="tile" id="btnStart">
      <span class="tile-main">
        <span class="tile-title">📖🎧 たんごを おぼえる</span>
        <span class="tile-sub">英語を 見て、🔊で 発音も きける。おぼえたら ボタンを おす</span>
      </span>
      <span class="tile-arrow">→</span>
    </button>
  </section>

  <!-- ===== はんいえらび ===== -->
  <section class="screen hidden" id="screen-ranges">
    <button class="back-btn" data-back="home">← もどる</button>
    <h2 class="scr-title">たんごを えらぶ</h2>
    <p class="scr-desc">英語を 見て(🔊で 発音も きける)、おぼえたら「✅ おぼえた」を おそう。</p>
    <div class="today-bar" id="rangeToday"></div>
    <div class="range-grid" id="rangeGrid"></div>
  </section>

  <!-- ===== たんごいちらん ===== -->
  <section class="screen hidden" id="screen-wordlist">
    <button class="back-btn" id="btnWordlistBack">← もどる</button>
    <h2 class="scr-title" id="wordlistTitle">たんごいちらん</h2>
    <p class="scr-desc">「✅ おぼえた」を おした 語だけが おぼえた ことに なります。もう しっている 語は「覚えた」で すぐに とばせます。</p>
    <div class="word-list" id="wordList"></div>
    <button class="tile tile-quiet" id="btnWordlistSkipAll"><span class="tile-main"><span class="tile-title">ぜんぶ おぼえた → まとめて おぼえたに</span></span></button>
    <button class="tile tile-primary" id="btnWordlistStart"><span class="tile-main"><span class="tile-title">カードで おぼえる</span></span><span class="tile-arrow">→</span></button>
  </section>

  <!-- ===== おぼえる(カード) ===== -->
  <section class="screen hidden" id="screen-learn">
    <button class="back-btn" data-back="home">← やめる</button>
    <div class="row-head">
      <span class="chip" id="learnZoneTag"></span>
      <span class="pos" id="learnPos">1 / 10</span>
    </div>

    <div class="card" id="card">
      <div class="card-face" id="cardFront">
        <div class="card-no" id="cardNo">No.1</div>
        <div class="slot" id="cardSlotQ">?</div>
        <div class="card-en" id="cardEn">house</div>
        <button class="sound-btn" id="btnSpeak">🔊 はつおんを きく</button>
        <div class="card-hint">タップして こたえを みる</div>
      </div>
      <div class="card-face hidden" id="cardBack">
        <div class="card-en small" id="cardEnBack">house</div>
        <div class="slot" id="cardEmoji">🏠</div>
        <div class="card-ja" id="cardJa">いえ</div>
        <div class="vis hidden" id="cardVis"></div>
        <div class="card-ex" id="cardEx"></div>
        <button class="sound-btn" id="btnSpeak2">🔊 たんごだけ きく</button>
      </div>
    </div>

    <div class="listen-note hidden" id="listenNote">にほんごの さいごまで きいてね…</div>

    <div class="nav-row">
      <button class="tile tile-quiet tile-nav" id="btnPrev"><span class="tile-main"><span class="tile-title">← まえ</span></span></button>
      <button class="tile tile-quiet tile-nav" id="btnNext"><span class="tile-main"><span class="tile-title">つぎ →</span></span></button>
    </div>
    <button class="tile tile-ok" id="btnLearned"><span class="tile-main"><span class="tile-title">✅ これは おぼえた</span></span></button>
  </section>

</div>

<div class="toast hidden" id="adv">
  <div class="toast-ic" id="advIc">✓</div>
  <div class="toast-body"><div class="toast-head" id="advHead"></div><div class="toast-name" id="advName"></div></div>
</div>

<script src="words-data.js"></script>
<script src="app.js"></script>
</body>
</html>

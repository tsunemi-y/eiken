<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えいごを よむ れんしゅう</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm 10mm; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "Zen Maru Gothic", "IPAGothic", sans-serif; color: #1b2230; }
  .page { height: 276mm; display: flex; flex-direction: column; }
  .page + .page { break-before: page; }
  h1 { font-size: 15pt; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-size: 9pt; color: #6b7384; font-weight: 500; }
  .how { font-size: 9.5pt; color: #4a5263; margin: 1.5mm 0 3mm; line-height: 1.5; }
  .how b { color: #2f6fe4; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 2mm; }
  .qc, .ac { border: .35mm solid #cfd5e0; border-radius: 2.5mm; position: relative; display: flex; align-items: center; }
  .no { position: absolute; top: 1.2mm; left: 2mm; font-family: "Inter", sans-serif; font-size: 8pt; font-weight: 700; color: #8a92a3; }
  .qc { justify-content: center; }
  .qc .en { font-family: "Inter", sans-serif; font-weight: 700; font-size: 21pt; letter-spacing: .01em; }
  .qc .chk { position: absolute; right: 2mm; bottom: 1.2mm; font-size: 7.5pt; color: #8a92a3; }
  .ac { flex-direction: column; justify-content: center; gap: .3mm; }
  .ac .en { font-family: "Inter", sans-serif; font-weight: 700; font-size: 13pt; }
  .ac .kana { font-size: 8.5pt; color: #6b7384; }
  .ac .ja { font-size: 12pt; font-weight: 700; color: #2f6fe4; }
</style>
</head>
<body>
<section class="page">
  <h1>📖 えいごを よんでみよう <small>{{N}}こ ・ きせつ・月・曜日・ぎもんし</small></h1>
  <div class="how">えいごだけを 見て ① <b>よみかた</b>を こえに だす → ② <b>いみ</b>を いう。できたら □ に ✓。<br>こたえは 2まいめ(子どもに 見せない)。じゅんばんは まぜてあるので、つづきで あてられないよ。</div>
  <div class="grid">{{Q}}</div>
</section>
<section class="page">
  <h1>✅ こたえ <small>おうちの ひと よう ・ ばんごうは 1まいめと おなじ</small></h1>
  <div class="how">カタカナは よみかたの めやす。ほんとうの 発音は アプリの 🔊 で たしかめてね。</div>
  <div class="grid">{{A}}</div>
</section>
</body>
</html>
